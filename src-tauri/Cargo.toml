[package]
name = "reclaim-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde_json = "1.0.154"
reclaim-core = { version = "0.1.0", path = "../crates/reclaim-core" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.3"
tempfile = "3.27.0"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSURL", "NSString", "NSFileManager", "NSError"] }

[lints]
workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
